appId: com.local.diettracker
productName: 饮食与体重记录助手
copyright: Copyright © 2026 Diet Tracker
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
win:
  icon: build/icon.png
  executableName: DietTracker
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: DietTracker-Setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 饮食与体重记录助手
  uninstallDisplayName: 饮食与体重记录助手
portable:
  artifactName: DietTracker-Portable.exe
  requestExecutionLevel: user
